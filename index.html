<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Testnet Directory</title>
    <style>
        :root {
            --accent: #00ffaa;
            --text: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* خلفية طقوس غامضة مضمونة الظهور */
        .ritual-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            /* صورة طقوس احترافية من مصدر موثوق */
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1514924013411-cbf25faa35bb?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            animation: slowZoom 20s infinite alternate; /* حركة بطيئة لتعويض الـ GIF */
        }

        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .scroll-wrapper {
            position: relative;
            z-index: 1;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .main-logo {
            width: 150px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 25px var(--accent);
            display: block;
            margin: 0 auto 20px;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px var(--accent); transform: scale(1); }
            50% { box-shadow: 0 0 40px var(--accent); transform: scale(1.03); }
        }

        h1 { font-size: 3rem; text-align: center; text-shadow: 0 0 15px var(--accent); margin-bottom: 50px; }

        .dapps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .dapp-card {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            text-align: right;
            transition: 0.3s ease;
        }

        .dapp-card:hover { border-color: var(--accent); transform: translateY(-10px); }

        .dapp-image {
            width: 100%; height: 160px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 15px;
            background: #222;
        }

        .dapp-name { font-size: 1.5rem; color: var(--accent); font-weight: bold; display: block; }
        
        /* خانة المطور */
        .by-text { font-size: 0.85rem; color: #888; margin-bottom: 10px; display: block; }
        
        /* خانة الوصف */
        .description { font-size: 0.9rem; color: #ccc; line-height: 1.6; margin-bottom: 20px; height: 70px; overflow: hidden; }

        .btn-visit {
            display: block;
            background: var(--accent);
            color: #000;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="ritual-bg"></div>

    <div class="scroll-wrapper">
        <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" alt="Ritual" class="main-logo">
        <h1>Ritual Testnet Directory</h1>

        <div class="dapps-grid">
            <!-- التطبيق 1 -->
            <div class="dapp-card">
                <img src="https://pbs.twimg.com/media/HGsZQ_gXUAA8uwp?format=jpg&name=4096x4096" class="dapp-image">
                <span class="dapp-name">Tanjoro Node</span>
                <span class="by-text">By: Ritual Community</span>
                <p class="description">وصف كامل للتطبيق وما يقدمه لنظام ريتوال في مرحلة التيست نت.</p>
                <a href="#" class="btn-visit">Visit Project</a>
            </div>

            <!-- تطبيق رقم 2 (Anthor App) -->
            <div class="dapp-card">
                <img src="https://via.placeholder.com/300x160/111/00ffaa?text=Anthor+App" class="dapp-image">
                <span class="dapp-name">Anthor App</span>
                <span class="by-text">By: Developer Name</span>
                <p class="description">وصف لمشروع **anthor** مخصص لمجتمع ريتوال[cite: 1].</p>
                <a href="#" class="btn-visit">Visit Project</a>
            </div>

            <!-- يمكنك تكرار هذه البطاقة للوصول لـ 10 تطبيقات[cite: 1] -->
        </div>
    </div>

</body>
</html>
