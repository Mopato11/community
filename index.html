<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Testnet Directory</title>
    <style>
        :root {
            --accent: #00ffaa;
            --text: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* خلفية بديلة ومضمونة لطقوس غامضة */
        .ritual-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: url('https://acegif.com/wp-content/uploads/2021/4af5/dark-forest-25.gif') no-repeat center center;
            background-size: cover;
            filter: brightness(0.2) contrast(1.2);
        }

        .scroll-container {
            height: 100vh;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px 20px;
        }

        .main-logo {
            width: 150px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px var(--accent);
            animation: float 3s ease-in-out infinite;
            display: block;
            margin: 0 auto 20px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 { font-size: 2.8rem; text-align: center; text-shadow: 0 0 15px var(--accent); margin-bottom: 50px; }

        .dapps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .dapp-card {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            text-align: right;
            transition: 0.3s;
        }

        .dapp-card:hover { border-color: var(--accent); transform: scale(1.02); }

        .dapp-image {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 15px;
            background: #1a1a1a;
        }

        .dapp-name { font-size: 1.5rem; color: var(--accent); font-weight: bold; display: block; }
        
        .creator { font-size: 0.9rem; color: #00ffaa; margin-bottom: 10px; display: block; opacity: 0.7; }
        
        .description { font-size: 0.95rem; color: #ccc; line-height: 1.6; margin-bottom: 20px; height: 80px; overflow: hidden; }

        .btn-visit {
            display: block;
            background: var(--accent);
            color: #000;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="ritual-bg"></div>

    <div class="scroll-container">
        <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" alt="Ritual" class="main-logo">
        <h1>Ritual Testnet Directory</h1>

        <div class="dapps-grid">
            <!-- التطبيق 1 -->
            <div class="dapp-card">
                <img src="https://pbs.twimg.com/media/HGsZQ_gXUAA8uwp?format=jpg&name=4096x4096" class="dapp-image">
                <span class="dapp-name">Tanjoro Node</span>
                <span class="creator">By: Ritual Community</span>
                <p class="description">وصف التطبيق هنا: يساعدك في تشغيل العقد الخاصة بك ضمن شبكة Ritual بكل سهولة.</p>
                <a href="https://x.com/ritualnet" class="btn-visit">Visit Here</a>
            </div>

            <!-- تطبيق رقم 2 (مثال لمشروع anthor) -->
            <div class="dapp-card">
                <img src="" class="dapp-image">
                <span class="dapp-name">Anthor App</span>
                <span class="creator">By: Dev Name</span>
                <p class="description">وصف لمشروع **anthor** مخصص لمجتمع ريتوال.</p>
                <a href="#" class="btn-visit">Visit Here</a>
            </div>

            <!-- كرر هذه البطاقات حتى تصل لـ 10 تطبيقات[cite: 1] -->
            <div class="dapp-card"><img src="" class="dapp-image"><span class="dapp-name">Soon</span><span class="creator">By: ---</span><p class="description">وصف قادم...</p><a href="#" class="btn-visit">Soon</a></div>
            <div class="dapp-card"><img src="" class="dapp-image"><span class="dapp-name">Soon</span><span class="creator">By: ---</span><p class="description">وصف قادم...</p><a href="#" class="btn-visit">Soon</a></div>
        </div>
    </div>

</body>
</html>
