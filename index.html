<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Testnet Directory</title>
    <style>
        :root {
            --accent: #00ffaa;
            --text: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* حاوية الخلفية المتحركة بالرابط الجديد */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-gif {
            width: 100%;
            height: 100%;
            object-fit: cover; /* لضمان ملء الشاشة */
            filter: brightness(0.3); /* تعتيم الصورة لتسهيل القراءة */
        }

        .overlay {
            position: relative;
            z-index: 1;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.4); /* طبقة تعتيم إضافية */
            min-height: 100vh;
        }

        .main-logo {
            width: 150px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px var(--accent);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 { font-size: 3rem; text-align: center; text-shadow: 0 0 15px var(--accent); }

        .dapps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 50px auto;
        }

        .dapp-card {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(5px);
            text-align: right;
        }

        .dapp-image {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .dapp-name { font-size: 1.4rem; color: var(--accent); font-weight: bold; }
        
        /* خانة By */
        .creator { font-size: 0.85rem; color: #888; display: block; margin-bottom: 10px; }
        
        /* خانة الوصف */
        .desc { font-size: 0.9rem; color: #ccc; line-height: 1.5; margin-bottom: 20px; }

        .btn {
            display: block;
            background: var(--accent);
            color: #000;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <!-- الرابط الذي أرسلته تم وضعه هنا كخلفية -->
        <img src="https://media.giphy.com/media/7NkyOb0hraA6Y/giphy.gif" class="bg-gif" alt="Ritual Rituals">
    </div>

    <div class="overlay">
        <div style="text-align: center;">
            <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" class="main-logo">
            <h1>Ritual Testnet</h1>
        </div>

        <div class="dapps-grid">
            <div class="dapp-card">
                <img src="https://pbs.twimg.com/media/HGsZQ_gXUAA8uwp?format=jpg&name=4096x4096" class="dapp-image">
                <span class="dapp-name">Tanjoro Node</span>
                <span class="creator">By: Ritual Community</span>
                <p class="desc">هذا التطبيق يساعدك على إدارة عقدك في شبكة Ritual بسهولة.</p>
                <a href="#" class="btn">Visit Here</a>
            </div>

            <!-- خانة لتطبيق anthor -->
            <div class="dapp-card">
                <img src="" class="dapp-image" style="background:#1a1a1a">
                <span class="dapp-name">Anthor dApp</span>
                <span class="creator">By: Developer Name</span>
                <p class="desc">وصف التطبيق الثاني وكيفية استخدامه.</p>
                <a href="#" class="btn">Visit Here</a>
            </div>
            
            <!-- يمكنك تكرار البطاقة حتى 10 مرات لـ evrey تطبيق جديد[cite: 1] -->
        </div>
    </div>

</body>
</html>
