<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Testnet Directory</title>
    <style>
        :root {
            --accent: #00ffaa;
            --text: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* حاوية الخلفية المتحركة */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        /* خلفية بديلة (صورة طقوس غامضة في حال فشل الفيديو) */
        .background-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaDE2dHpiYWFycDRvY2x3dnEwMDg0a25xYjZscHozZnNka3pzeWgwNyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/7NkyOb0hraA6Y/giphy.gif');
            background-size: cover;
            background-position: center;
            filter: brightness(0.2) contrast(1.5);
        }

        .overlay {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.6); /* تعتيم إضافي لبروز المحتوى */
            padding: 40px 20px;
        }

        .main-logo {
            width: 160px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 30px var(--accent);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        h1 { font-size: 3rem; text-align: center; text-shadow: 0 0 20px var(--accent); }

        .dapps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 50px auto;
        }

        .dapp-card {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: 0.4s;
            text-align: right;
        }

        .dapp-card:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
        }

        .dapp-image {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .dapp-name { font-size: 1.5rem; color: var(--accent); font-weight: bold; }
        
        /* خانة By (من أنشأ التطبيق) */
        .created-by { font-size: 0.85rem; color: #00ffaa; margin-bottom: 10px; display: block; opacity: 0.8; }
        
        /* خانة الوصف */
        .dapp-description { font-size: 0.9rem; color: #ccc; line-height: 1.6; margin-bottom: 20px; }

        .visit-btn {
            display: block;
            background: var(--accent);
            color: #000;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <div class="overlay">
        <div style="text-align: center;">
            <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" alt="Ritual Logo" class="main-logo">
            <h1>Ritual Testnet</h1>
        </div>

        <div class="container">
            <div class="dapps-grid">
                
                <!-- تطبيق 1 -->
                <div class="dapp-card">
                    <img src="https://pbs.twimg.com/media/HGsZQ_gXUAA8uwp?format=jpg&name=4096x4096" class="dapp-image">
                    <span class="dapp-name">Tanjoro Node</span>
                    <span class="created-by">By: Ritual Community</span>
                    <p class="dapp-description">هذا التطبيق هو بوابتك لتشغيل عقدة Infernet والمشاركة في بناء مستقبل الذكاء الاصطناعي اللامركزي.</p>
                    <a href="https://x.com/ritualnet" class="visit-btn">Visit Here</a>
                </div>

                <!-- تطبيق 2 -->
                <div class="dapp-card">
                    <img src="https://via.placeholder.com/300x160/111/00ffaa?text=Anthor+Project" class="dapp-image">
                    <span class="dapp-name">Anthor App</span>
                    <span class="created-by">By: meison</span>
                    <p class="dapp-description">وصف التطبيق الثاني وكيفية عمله ضمن نظام ريتوال.</p>
                    <a href="#" class="visit-btn">Visit Here</a>
                </div>

                <!-- كرر هذه البطاقة للوصول لـ 10 تطبيقات -->

            </div>
        </div>
    </div>

</body>
</html>
