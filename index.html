<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Mystical Directory</title>
    <style>
        :root {
            --candle-green: #00ffaa;
            --fire-glow: rgba(0, 255, 170, 0.2);
        }

        body {
            margin: 0; padding: 0;
            background: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* خلفية الضباب والطقوس */
        .mystic-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at bottom, #0a221a 0%, #000 80%);
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 60px 20px;
        }

        /* شعار ريتوال بتأثير الهالة المشتعلة */
        .main-logo {
            width: 140px;
            border-radius: 50%;
            border: 2px solid var(--candle-green);
            box-shadow: 0 0 50px var(--candle-green), inset 0 0 20px var(--candle-green);
            animation: flame-pulse 2s infinite alternate;
        }

        @keyframes flame-pulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.05); filter: brightness(1.5) drop-shadow(0 0 20px var(--candle-green)); }
        }

        /* تصميم خانة التطبيق كأنها شمعة أو محراب */
        .dapps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 50px auto;
        }

        .dapp-card {
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 4px solid #111;
            border-radius: 15px;
            padding: 30px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            overflow: hidden;
        }

        /* تأثير النار الخضراء خلف الخانة عند التفاعل */
        .dapp-card::before {
            content: "";
            position: absolute;
            top: 100%; left: 50%;
            width: 120%; height: 100%;
            background: radial-gradient(circle, var(--candle-green) 0%, transparent 70%);
            transform: translateX(-50%);
            transition: 0.5s;
            opacity: 0;
            filter: blur(40px);
            z-index: -1;
        }

        /* المؤثرات عند تمرير الماوس أو الضغط */
        .dapp-card:hover, .dapp-card:active {
            transform: translateY(-15px) scale(1.02);
            border-bottom-color: var(--candle-green);
            box-shadow: 0 10px 40px rgba(0, 255, 170, 0.3);
        }

        .dapp-card:hover::before {
            top: 40%;
            opacity: 0.4;
        }

        /* أيقونة التطبيق */
        .dapp-image {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid #222;
            filter: grayscale(0.5);
            transition: 0.3s;
        }

        .dapp-card:hover .dapp-image {
            filter: grayscale(0) brightness(1.2);
            border-color: var(--candle-green);
        }

        .dapp-name { 
            color: var(--candle-green); 
            font-size: 1.6rem; 
            margin: 15px 0 5px; 
            display: block;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
        }

        .by-text { color: #888; font-size: 0.85rem; display: block; margin-bottom: 15px; }
        
        /* خانة الوصف */
        .description { 
            color: #bbb; 
            font-size: 0.95rem; 
            line-height: 1.6; 
            height: 60px;
            margin-bottom: 20px;
        }

        .btn-action {
            display: block;
            background: transparent;
            color: var(--candle-green);
            border: 1px solid var(--candle-green);
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            position: relative;
            z-index: 2;
        }

        .btn-action:hover {
            background: var(--candle-green);
            color: black;
            box-shadow: 0 0 20px var(--candle-green);
        }
    </style>
</head>
<body>

    <div class="background-ritual"></div>

    <!-- الشموع المتحركة -->
    <div class="candles-container">
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
        <div class="candle" style="height: 120px;"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
        <div class="candle" style="height: 80px;"><div class="flame"></div></div>
    </div>

    <div class="mystic-overlay"></div>

    <div class="container">
        <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" class="main-logo">
        <h1 style="font-size: 3rem; letter-spacing: 2px;">RITUAL SHRINE</h1>
        <p style="color: #666;">Explore the decentralized rituals</p>

        <div class="dapps-grid">
            <!-- تطبيق 1 -->
            <div class="dapp-card">
                <img src="https://pbs.twimg.com/media/HGsZQ_gXUAA8uwp?format=jpg&name=4096x4096" class="dapp-image">
                <span class="dapp-name">Tanjoro Node</span>
                <span class="by-text">By: Ritual Community</span>
                <p class="description">أداة متقدمة لتشغيل العقد في شبكة ريتوال مع واجهة طقوسية سهلة.</p>
                <a href="#" class="btn-action">ACTIVATE</a>
            </div>

            <!-- تطبيق Anthor -->
            <div class="dapp-card">
                <img src="https://via.placeholder.com/400x250/050505/00ffaa?text=Anthor+App" class="dapp-image">
                <span class="dapp-name">Anthor Project</span>
                <span class="by-text">By: Mystic Dev</span>
                <p class="description">هذا المشروع هو **anthor** خطوة في بناء مستقبل الذكاء الاصطناعي اللامركزي.</p>
                <a href="#" class="btn-action">ACTIVATE</a>
            </div>
            
            <!-- كرر الخانات حتى 10[cite: 1] -->
        </div>
    </div>

</body>
</html>
