<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Testnet Directory</title>
    <style>
        /* خلفية ألوان متحركة مضمونة 100% */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(-45deg, #000000, #0a221a, #00ffaa, #050505);
            background-size: 400% 400%;
            animation: ritualGradient 10s ease infinite;
            color: white;
            font-family: sans-serif;
            min-height: 100vh;
        }

        @keyframes ritualGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-container {
            text-align: center;
            padding: 50px 20px;
            background: rgba(0, 0, 0, 0.4); /* طبقة تعتيم خفيفة */
            min-height: 100vh;
        }

        .main-logo {
            width: 150px;
            border-radius: 50%;
            border: 3px solid #00ffaa;
            box-shadow: 0 0 20px #00ffaa;
            margin-bottom: 20px;
        }

        h1 { font-size: 2.5rem; text-shadow: 0 0 10px #00ffaa; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 40px auto;
        }

        .card {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            text-align: right;
        }

        .dapp-img {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            background: #111;
            object-fit: cover;
        }

        .dapp-name { color: #00ffaa; font-size: 1.4rem; font-weight: bold; display: block; margin-top: 10px; }
        .by-text { color: #888; font-size: 0.8rem; display: block; margin-bottom: 10px; }
        .desc-text { color: #ccc; font-size: 0.9rem; line-height: 1.4; margin-bottom: 20px; }

        .btn {
            display: block;
            background: #00ffaa;
            color: black;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" class="main-logo">
        <h1>Ritual Testnet Directory</h1>

        <div class="grid">
            <!-- التطبيق 1 -->
            <div class="card">
                <img src="https://pbs.twimg.com/media/HGsZQ_gXUAA8uwp?format=jpg&name=4096x4096" class="dapp-img">
                <span class="dapp-name">Tanjoro Node</span>
                <span class="by-text">By: Ritual Community</span>
                <p class="desc-text">وصف المشروع وكيفية استخدامه في شبكة التجربة.</p>
                <a href="#" class="btn">Visit Here</a>
            </div>

            <!-- تطبيق Anthor -->
            <div class="card">
                <img src="" class="dapp-img">
                <span class="dapp-name">Anthor App</span>
                <span class="by-text">By: Developer Name[cite: 1]</span>
                <p class="desc-text">هذا تطبيق **anthor** مخصص لمجتمع ريتوال[cite: 1].</p>
                <a href="#" class="btn">Visit Here</a>
            </div>
        </div>
    </div>

</body>
</html>
