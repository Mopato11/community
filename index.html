<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Testnet | Ecosystem</title>
    <style>
        :root {
            --accent: #00ffaa;
            --text: #ffffff;
            --overlay: rgba(0, 0, 0, 0.7); /* طبقة تعتيم فوق الخلفية لظهور الكلام */
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: var(--text);
            overflow-x: hidden;
        }

        /* فيديو أو صورة الخلفية المتحركة */
        .bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            filter: brightness(0.4) grayscale(0.5); /* لجعلها تبدو كطقوس غامضة */
            object-fit: cover;
        }

        .content-overlay {
            background: var(--overlay);
            min-height: 100vh;
            width: 100%;
        }

        header {
            padding: 60px 20px;
            text-align: center;
        }

        .main-logo {
            width: 150px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: pulse 2s infinite ease-in-out;
            box-shadow: 0 0 20px var(--accent);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        h1 {
            font-size: 3rem;
            margin-top: 20px;
            text-shadow: 0 0 10px var(--accent);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .dapps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .dapp-card {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px); /* تأثير زجاجي */
            transition: 0.3s;
            text-align: right;
        }

        .dapp-card:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
        }

        .dapp-image {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 1px solid #444;
        }

        .dapp-name {
            font-size: 1.4rem;
            color: var(--accent);
            display: block;
            margin-bottom: 5px;
        }

        .creator-name {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 10px;
            display: block;
            font-style: italic;
        }

        .dapp-desc {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 20px;
            height: 60px;
            overflow: hidden;
        }

        .dapp-link {
            display: block;
            background: var(--accent);
            color: #000;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .dapp-link:hover { background: #fff; }

    </style>
</head>
<body>

    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNGI4YmZkMzVjMTI4YjFkMmY0ZDE5ZTkyN2I0YjVlZDM0ZDY5ZDY5ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKv6eCiGsg9B7JS/giphy.gif" class="bg-video" alt="Ritual Background">

    <div class="content-overlay">
        <header>
            <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" alt="Ritual Logo" class="main-logo">
            <h1>Ritual Testnet Directory</h1>
        </header>

        <div class="container">
            <div class="dapps-grid">
                
                <div class="dapp-card">
                    <img src="https://pbs.twimg.com/media/HGsZQ_gXUAA8uwp?format=jpg&name=4096x4096" class="dapp-image">
                    <span class="dapp-name">Tanjoro Node</span>
                    <span class="creator-name">By: Ritual Community</span>
                    <p class="dapp-desc">هذا التطبيق يسمح لك بربط عقدة الذكاء الاصطناعي الخاصة بك ببروتوكول Infernet بكل سهولة.</p>
                    <a href="https://x.com/ritualnet" class="dapp-link">Visit Project</a>
                </div>

                <div class="dapp-card">
                    <img src="رابط_صورة_هنا" class="dapp-image">
                    <span class="dapp-name">Anthor dApp</span>
                    <span class="creator-name">By: @username</span>
                    <p class="dapp-desc">وصف دقيق للمشروع وكيف يخدم مستخدمي ريتوال في مرحلة التيست نت.</p>
                    <a href="#" class="dapp-link">Visit Project</a>
                </div>

                </div>
        </div>
    </div>

</body>
</html>
