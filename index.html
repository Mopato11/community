<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Testnet Directory</title>
    <style>
        :root {
            --ritual-green: #00ffaa;
            --fire-glow: rgba(0, 255, 170, 0.3);
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            /* تغيير اتجاه الصفحة بالكامل لليسار */
            direction: ltr; 
        }

        /* الخلفية والشموع */
        .ritual-altar {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #051a14 0%, #000 90%);
            z-index: -1;
        }

        .candle {
            position: absolute;
            bottom: 30px;
            width: 35px;
            height: 140px;
            background: linear-gradient(to top, #002211, #00ffaa);
            border-radius: 5px;
            box-shadow: 0 0 30px var(--fire-glow);
        }

        .flame {
            position: absolute;
            top: -30px; left: 50%;
            transform: translateX(-50%);
            width: 18px; height: 30px;
            background: #fff;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 25px var(--ritual-green), 0 0 50px var(--ritual-green);
            animation: flicker 0.15s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: 1; }
        }

        /* الشعار الضخم والمتحرك */
        .logo-container {
            perspective: 1000px;
            margin-top: 50px;
            text-align: center;
        }

        .main-logo {
            width: 220px;
            border-radius: 50%;
            border: 4px solid var(--ritual-green);
            filter: drop-shadow(0 0 30px var(--ritual-green));
            animation: rotate3D 8s linear infinite;
        }

        @keyframes rotate3D {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        /* العنوان المزخرف */
        .title-wrapper { text-align: center; }
        .ritual-title {
            font-size: 3.5rem;
            margin: 30px 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--ritual-green), 0 0 20px var(--ritual-green);
            font-weight: 900;
            display: inline-block;
        }

        .ritual-title::before, .ritual-title::after {
            content: " ✧ ";
            color: var(--ritual-green);
            animation: pulseFade 2s infinite;
        }

        @keyframes pulseFade {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* شبكة التطبيقات */
        .dapps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 60px auto;
            padding: 20px;
        }

        .dapp-card {
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #1a1a1a;
            border-radius: 25px;
            padding: 30px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            /* المحاذاة لليسار */
            text-align: left; 
            backdrop-filter: blur(10px);
        }

        .dapp-card:hover {
            border-color: var(--ritual-green);
            transform: translateY(-15px) rotateX(10deg);
            box-shadow: 0 20px 40px rgba(0, 255, 170, 0.2);
        }

        .dapp-image {
            width: 100%; height: 180px;
            border-radius: 15px;
            object-fit: cover;
            background: #111;
            border: 1px solid #333;
        }

        .dapp-name { color: var(--ritual-green); font-size: 1.6rem; font-weight: bold; margin: 20px 0 5px; display: block; }
        .by-text { color: #888; font-size: 0.9rem; margin-bottom: 15px; display: block; font-style: italic; }
        .description { color: #bbb; font-size: 1rem; line-height: 1.6; margin-bottom: 25px; height: 80px; overflow: hidden; }

        .btn-visit {
            display: block;
            background: var(--ritual-green);
            color: #000;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 900;
            transition: 0.3s;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 255, 170, 0.3);
        }

        .btn-visit:hover {
            background: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="ritual-altar">
        <!-- الشموع -->
        <div class="candle" style="left: 5%; bottom: 40px;"><div class="flame"></div></div>
        <div class="candle" style="right: 5%; bottom: 60px;"><div class="flame"></div></div>
        <div class="candle" style="left: 15%; bottom: 180px; transform: scale(0.6);"><div class="flame"></div></div>
        <div class="candle" style="right: 15%; bottom: 220px; transform: scale(0.5);"><div class="flame"></div></div>
    </div>

    <div class="title-wrapper">
        <!-- الشعار -->
        <div class="logo-container">
            <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" class="main-logo">
        </div>
        <!-- العنوان -->
        <h1 class="ritual-title">Ritual community dApps</h1>
    </div>

    <div class="dapps-grid">
        <!-- Card 1 -->
        <div class="dapp-card">
            <img src="https://pbs.twimg.com/media/HGsZQ_gXUAA8uwp?format=jpg&name=4096x4096" class="dapp-image">
            <span class="dapp-name">Tanjoro Node</span>
            <span class="by-text">By: Ritual Community</span>
            <p class="description">Experience peak performance with the first sovereign AI node on the Ritual protocol.</p>
            <a href="https://web-3-profile-mint--rolex9723060.replit.app" class="btn-visit">ENTRANCE</a>
        </div>

        <!-- Card 2 -->
        <div class="dapp-card">
            <img src="blob:https://www.image2url.com/045cee44-b8f3-43a1-90c2-93cb9ad5237f" class="dapp-image">
            <span class="dapp-name">Mint your identity</span>
            <span class="by-text">By: Tanjiro</span>
            <p class="description">Mint your identity on Ritual Chain.</p>
            <a href="#" class="btn-visit">ENTRANCE</a>
        </div>
    </div>

</body>
</html>
