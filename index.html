<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Testnet Directory</title>
    <style>
        :root {
            --accent: #00ffaa;
            --card-bg: rgba(10, 10, 10, 0.85);
            --text: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: var(--text);
            overflow-x: hidden;
        }

        /* خلفية الفيديو/الصورة المتحركة لطقوس */
        .ritual-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* رابط صورة متحركة تعبر عن طقوس غامضة */
            background: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZleHh3YmE5ZzR3NXpxYm4yeW9qbm9ueXp2Z3R4bmVycXp4eHh4eCZlcD12MV9pbnRlcm5hbF9naZ9ieV9pZCZjdD1n/618uP05GIsO6A/giphy.gif') no-repeat center center fixed;
            background-size: cover;
            filter: brightness(0.3) contrast(1.2); /* تعتيم الخلفية لبروز الكلام */
        }

        .main-content {
            position: relative;
            z-index: 1;
            padding: 40px 20px;
            text-align: center;
        }

        .main-logo {
            width: 160px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 30px var(--accent);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px var(--accent); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px var(--accent); }
            100% { transform: scale(1); box-shadow: 0 0 20px var(--accent); }
        }

        h1 { font-size: 3rem; text-shadow: 0 0 15px var(--accent); margin: 20px 0; }

        .dapps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 40px auto;
        }

        .dapp-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(8px);
            transition: 0.4s;
            text-align: right;
        }

        .dapp-card:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
        }

        .dapp-image {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 1px solid #444;
        }

        .dapp-name { font-size: 1.5rem; color: var(--accent); display: block; }
        
        .creator { font-size: 0.9rem; color: #888; margin-bottom: 15px; display: block; }
        
        .dapp-desc { font-size: 0.95rem; color: #ccc; line-height: 1.6; margin-bottom: 20px; height: 75px; overflow-y: auto; }

        .visit-btn {
            display: block;
            background: var(--accent);
            color: #000;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .visit-btn:hover { background: #fff; transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="ritual-bg"></div>

    <div class="main-content">
        <header>
            <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" alt="Ritual Logo" class="main-logo">
            <h1>Ritual Testnet Directory</h1>
        </header>

        <div class="dapps-grid">
            
            <!-- تطبيق مثال 1 -->
            <div class="dapp-card">
                <img src="https://pbs.twimg.com/media/HGsZQ_gXUAA8uwp?format=jpg&name=4096x4096" class="dapp-image">
                <span class="dapp-name">Tanjoro Node</span>
                <span class="creator">By: Ritual Community</span>
                <p class="dapp-desc">هذا التطبيق هو بوابتك لتشغيل عقدة Infernet والمشاركة في بناء مستقبل الذكاء الاصطناعي اللامركزي.</p>
                <a href="https://x.com/ritualnet" class="visit-btn">زيارة المشروع</a>
            </div>

            <!-- تطبيق مثال 2 (Anthor) -->
            <div class="dapp-card">
                <img src="https://via.placeholder.com/300x160/111/00ffaa?text=Anthor+dApp" class="dapp-image">
                <span class="dapp-name">Anthor Project</span>
                <span class="creator">By: YourName</span>
                <p class="dapp-desc">وصف دقيق للمشروع الثاني وكيفية الاستفادة منه في نظام Ritual Testnet.</p>
                <a href="#" class="visit-btn">زيارة المشروع</a>
            </div>

            <!-- يمكنك تكرار هذه البطاقات حتى 10 -->

        </div>
    </div>

</body>
</html>
